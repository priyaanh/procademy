<script>
/* Visits every page (home, courses, units, skills, CPM books and lessons) and reports script errors,
   leaked "undefined"/"NaN" text, and anything wider than the screen. run.sh opens it at phone width. */
(async function () {
  const A = ACADEMY, main = document.getElementById('main');
  const tick = ms => new Promise(r => setTimeout(r, ms || 0));
  let errors = [];
  window.addEventListener('error', e => errors.push(String(e.message)));
  const routes = ['#/geometry/sketch', '#/geometry/construct', '#/geometry/transform', '#/measure/units', '#/measure/scale', '#/chance/draw2', '#/chance/coindie', '#/', '#/courses', '#/courses/Elementary', '#/courses/Middle%20school', '#/courses/High%20school', '#/courses/cpm', '#/courses/saved', '#/progress', '#/settings', '#/new', '#/unlimited', '#/unlimited/all', '#/unlimited/course/math-7', '#/unlimited/chapter/cc2/3', '#/unlimited/mine', '#/search/fraction', '#/review', '#/cpm', '#/tutor', '#/tutor/new'];
  A.courses.forEach(c => { routes.push('#/course/' + c.id); c.units.forEach(u => routes.push('#/unit/' + c.id + '/' + u.id)); });
  Object.keys(A.skills).forEach(id => routes.push('#/skill/' + encodeURIComponent(id)));
  A.cpm.forEach(b => { routes.push('#/cpm/' + b.id); b.chapters.forEach(ch => ch.lessons.forEach(l => routes.push('#/cpm/' + b.id + '/' + l.id))); });
  // the newer pages: today's practice, the graphing calculator (with sliders), and a worksheet for every unit and some lessons
  routes.push('#/setup', '#/tiles', '#/tiles/compare', '#/tiles/eq/' + DRAW.encode('3x - 2 = x + 6'), '#/chance', '#/chance/dice', '#/chance/bag', '#/chance/coins2', '#/words', '#/words/cards', '#/words/absolute-value', '#/profile', '#/report', '#/vs/' + DRAW.encode(JSON.stringify({ k: 'p', id: 'math7.add-negatives', seed: 'abc12', score: 6, total: 7, name: 'Sam' })), '#/vs/' + DRAW.encode(JSON.stringify({ k: 's', id: 'times', secs: 60, seed: 'q9', score: 31 })), '#/vs/broken');
  routes.push('#/sprint', '#/steps', '#/steps/' + DRAW.encode('3(x - 4) = 2x + 5\n3x - 12 = 2x + 5\nx = 17\n-2x + 5 > 11\nx > -3'), '#/prep/cc2/3', '#/prep/int1/2');
  SPRINT.DECKS.forEach(d => routes.push('#/sprint/' + d.id));
  routes.push('#/tools', '#/calc', '#/calc/' + encodeURIComponent('2 + 3 × (4 − 1)² − 1/3 + 1/7'), '#/calc/' + encodeURIComponent('100!'), '#/numbers', '#/numbers/84', '#/numbers/97', '#/numbers/360', '#/numbers/999999999989', '#/numbers/1048576', '#/numbers/12-18', '#/numbers/24-36-60', '#/numbers/1', '#/data', '#/data/' + DRAW.encode(JSON.stringify(DATA.EXAMPLES[1][1])), '#/data/' + DRAW.encode(JSON.stringify(DATA.EXAMPLES[2][1])), '#/data/' + DRAW.encode(JSON.stringify(DATA.EXAMPLES[3][1])));
  Object.keys(SHAPES.KINDS).forEach(k => routes.push('#/shapes/' + k));
  routes.push('#/shapes', '#/shapes/box/12_10_8_cm', '#/shapes/sides/3_4_8', '#/shapes/sides/2_2_2', '#/shapes/angle/250', '#/shapes/tri/9_4_140_ft', '#/shapes/cyl/0.5_1000', '#/shapes/frame/5_5_6_2');
  Object.keys(PERCENT.MODES).forEach(k => routes.push('#/percent/' + k));
  routes.push('#/percent', '#/percent/interest/250000_7.5_40', '#/percent/of/250_1234.5', '#/percent/change/80_20', '#/percent/bill/1234.56_20_9.5_7', '#/leap', '#/leap/daily', '#/leap/25', '#/balance', '#/balance/daily', '#/balance/30');
  Object.keys(FRACTIONS.OPS).forEach(k => routes.push('#/fractions/' + k));
  routes.push('#/fractions', '#/fractions/add/999-1000_1-999', '#/fractions/sub/1-8_7-8', '#/fractions/mul/1000_1000', '#/fractions/mul/7-13_11-12', '#/fractions/div/12_1-8', '#/fractions/div/0_1-2', '#/fractions/div/1-1000_1000', '#/fractions/compare/3-1-2_3.5', '#/fractions/simplify/0-5', '#/fractions/simplify/1-7', '#/fractions/add/bad_1-0');
  Object.keys(INTEGERS.OPS).forEach(k => routes.push('#/integers/' + k));
  routes.push('#/integers', '#/integers/build', '#/integers/build/7', '#/integers/sub/-20_20', '#/integers/mul/-12_5', '#/integers/mul/-20_-3', '#/integers/div/-60_-1', '#/integers/div/7_-2', '#/integers/div/0_5', '#/integers/div/4_0', '#/integers/add/250_-1000', '#/integers/add/0_0', '#/integers/sub/1.5_2', '#/integers/nope/1_2');
  A.courses.forEach(c => routes.push('#/placement/' + c.id));
  routes.push('#/unlimited/find/fractions', '#/unlimited/find/slope', '#/notes', '#/family', '#/family/add/broken');
  routes.push('#/daily', '#/graph', '#/graph/' + DRAW.encode('y = a(x - h)^2 + k\na = 1\nh = 2\nk = -3\nx^2 + y^2 < 16\ntriangle A(1,1) B(4,1) C(1,3)'));
  A.courses.forEach(c => c.units.forEach(u => routes.push('#/worksheet/unit/' + c.id + '/' + u.id)));
  A.cpm.forEach(b => b.chapters.slice(0, 2).forEach(ch => ch.lessons.slice(0, 2).forEach(l => { if (l.skills.some(id => A.skills[id])) routes.push('#/worksheet/lesson/' + b.id + '/' + encodeURIComponent(l.id)); })));
  // wait for the page to change (a fixed pause reads the previous page on a busy computer); a repeated route has no change to wait for
  const arrive = h => new Promise(res => { const t = setTimeout(res, 1000); addEventListener('hashchange', () => { clearTimeout(t); res(); }, { once: true }); location.hash = h; });
  const problems = { error: [], text: [], wide: [] };
  for (const r of routes) {
    errors = [];
    if (new URLSearchParams(location.search).get('trace')) console.log('AT ' + r + (performance.memory ? ' ' + Math.round(performance.memory.usedJSHeapSize / 1e6) + ' MB' : ''));
    await arrive(r); await tick(5);
    const t = main.innerText || '';
    if (errors.length) problems.error.push(r + ' :: ' + errors[0]);
    const bad = t.replace(/\b(is|are|be|and) undefined\b/g, '').match(/\bundefined\b|\bNaN\b|\[object Object\]|Something went wrong/);      // “tangent is undefined” is math
    if (bad) problems.text.push(r + ' :: ' + bad[0] + ' :: ' + t.slice(Math.max(0, t.indexOf(bad[0]) - 60), t.indexOf(bad[0]) + 40).replace(/\s+/g, ' '));
    const vw = document.documentElement.clientWidth;
    if (document.documentElement.scrollWidth > vw + 1) {
      let worst = null;
      main.querySelectorAll('*').forEach(el => { const b = el.getBoundingClientRect(); if (b.right > vw + 1 && (!worst || b.right > worst.r)) worst = { r: b.right, el }; });
      problems.wide.push(r + ' :: ' + document.documentElement.scrollWidth + 'px :: ' + (worst ? worst.el.tagName + '.' + worst.el.className + ' "' + (worst.el.innerText || '').slice(0, 40).replace(/\s+/g, ' ') + '"' : '?'));
    }
  }
  console.log('ROUTES ' + routes.length + ' at ' + document.documentElement.clientWidth + 'px wide');
  for (const k of Object.keys(problems)) { console.log('PROBLEM ' + k + ' ' + problems[k].length); problems[k].slice(0, +(new URLSearchParams(location.search).get('show') || 12)).forEach(p => console.log('  ' + k + ': ' + p)); }
  const failed = Object.values(problems).reduce((a, l) => a + l.length, 0);
  console.log(`RESULTS ${failed} failed of ${routes.length}`);
})();
